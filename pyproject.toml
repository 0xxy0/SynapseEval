[project]
name = "SynapseEval"
version = "0.0.1" 
description = "Evaluating LLM code generation with HumanEval benchmarks through Ollama automation."
readme = "README.md"

requires-python = ">=3.12"
keywords = ["llm", "evaluation", "humaneval", "ollama", "benchmark", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "llm-sandbox[docker]>=0.3.16",
    "diskcache>=5.6.3",
    "matplotlib>=3.10.6",
    "numpy>=2.3.1",
    "ollama-think>=0.1.9",
    "plotly>=6.3.0",
    "rich>=14.3.2",
    "scipy>=1.16.2",
    "typer>=0.12.5",
]


[project.scripts]
SynapseEval = "SynapseEval.cli:app"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.3",
]

